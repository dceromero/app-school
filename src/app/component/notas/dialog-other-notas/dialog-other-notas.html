<p-dialog header="Otras Notas y Ausencias" [visible]="inOtherNotes()!.length > 0" [modal]="true" position="top"
    [maximizable]="true">
    <p-fieldset legend="Planila de Otras Notas y Ausencias">
        <p-table #dtOtherNotes size="small" [value]="inOtherNotes()" [paginator]="true" [rows]="10"
            [tableStyle]="{ 'min-width': '80rem' }" showGridlines stripedRows [rowsPerPageOptions]="[5, 10, 20]">

            <ng-template #header>
                <tr>
                    <th style="width:40%">Alumno</th>
                    <th style="width:10%">ausencias</th>
                    <th style="width:10%">nIcfes</th>
                    <th style="width:10%">notaRp</th>
                    <th style="width:10%">notaRF</th>
                    <th style="width:10%">notaNiv</th>
                    <th style="width:10%">notaEU</th>
                </tr>
            </ng-template>
            <ng-template #body let-otherNote let-rowIndex="rowIndex">
                <tr>
                    <td style="font-size: 15px;">{{ otherNote.apellidos }} {{ otherNote.nombres }}</td>
                    <td [pEditableColumn]="otherNote.ausencias" pEditableColumnField="ausencias"
                        id="ausencias{{rowIndex}}">
                        <p-cellEditor>
                            <ng-template #input>
                                <p-inputnumber [min]="0" [max]="100" size="small" [(ngModel)]="otherNote.ausencias"
                                    fluid />
                            </ng-template>
                            <ng-template #output>
                                {{ otherNote.ausencias }}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td [pEditableColumn]="otherNote.nIcfes" pEditableColumnField="nIcfes">
                        <p-cellEditor>
                            <ng-template #input>
                                <p-inputnumber [min]="0" [max]="100" size="small" [(ngModel)]="otherNote.nIcfes"
                                    fluid />
                            </ng-template>
                            <ng-template #output>
                                {{ otherNote.nIcfes }}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td [pEditableColumn]="otherNote.notaRp" pEditableColumnField="notaRp">
                        <p-cellEditor>
                            <ng-template #input>
                                <p-inputnumber [min]="0" [max]="100" size="small" [(ngModel)]="otherNote.notaRp"
                                    fluid />
                            </ng-template>
                            <ng-template #output>
                                {{ otherNote.notaRp }}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td [pEditableColumn]="otherNote.notaRF" pEditableColumnField="notaRF">
                        <p-cellEditor>
                            <ng-template #input>
                                <p-inputnumber [showButtons]="true" [min]="0" [max]="100" size="small"
                                    [(ngModel)]="otherNote.notaRF" fluid />
                            </ng-template>
                            <ng-template #output>
                                {{ otherNote.notaRF }}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td [pEditableColumn]="otherNote.notaNiv" pEditableColumnField="notaNiv">
                        <p-cellEditor>
                            <ng-template #input>
                                <p-inputnumber [min]="0" [max]="100" size="small" [(ngModel)]="otherNote.notaNiv"
                                    fluid />
                            </ng-template>
                            <ng-template #output>
                                {{ otherNote.notaNiv }}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td [pEditableColumn]="otherNote.notaEU" pEditableColumnField="notaEU">
                        <p-cellEditor>
                            <ng-template #input>
                                <p-inputnumber [showButtons]="true" [min]="0" [max]="100" size="small"
                                    (onBlur)="save(otherNote)" [(ngModel)]="otherNote.notaEU" fluid />
                            </ng-template>
                            <ng-template #output>
                                {{ otherNote.notaEU }}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                </tr>
            </ng-template>
        </p-table>
        <hr class="mt-3">
        <div class="mt-3" style="text-align: center;">
             <button pButton type="button" label="Guardar" icon="pi pi-save" class="p-button-primary"
                (click)="saveAll()"></button>
            <button pButton type="button" label="Cerrar" icon="pi pi-times" class="p-button-secondary"
                (click)="closeDialog()"></button>           
        </div>
    </p-fieldset>
</p-dialog>
