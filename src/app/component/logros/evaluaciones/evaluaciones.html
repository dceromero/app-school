<p-dialog header="Evalauaciones" [visible]="inEvaluaciones()!=null" [modal]="true" position="top">
    <form [formGroup]="formEvaluaciones">
        <div class="grid grid-cols-1 mt-1">
            <p-floatlabel variant="on">
                <textarea pTextarea id="txtTextoLg" [ngModel]="inEvaluaciones()?.textoLg" rows="3" cols="30" style="resize: none" fluid formControlName="descLogro"></textarea>
                <label for="txtTextoLg">Logro</label>
            </p-floatlabel>
        </div>
        <div class="grid grid-cols-4 mt-3 gap-4">
            <div>
                <p-floatlabel variant="on">
                    <p-inputnumber size="small" id="txtCantNotas" [ngModel]="inEvaluaciones()?.cantNotas" fluid  formControlName="cantNotas"/>
                    <label for="txtCantNotas">Cantidad de Notas</label>
                </p-floatlabel>
            </div>
            <div>
        <p-floatlabel variant="on">
          <p-select | size="small"
            [filter]="true"  [showClear]="true" fluid >
            <ng-template #selectedItem let-selectedOption>
              <div class="flex items-center gap-2">
                <div>{{ selectedOption.codGrado }} - {{ selectedOption.descGrado }}</div>
              </div>
            </ng-template>
            <ng-template let-grado #item>
              <div class="flex items-center gap-2">
                <div>{{ grado.codGrado }} - {{ grado.descGrado }}</div>
              </div>
            </ng-template>
          </p-select>
          <label for="txtGrado">Grado</label>
        </p-floatlabel>
      </div>
        </div>
        <div class="flex justify-center mt-3 gap-4">
            <p-button label="Guardar" severity="success"  />
            <p-button label="Cerrar" severity="secondary"  />
        </div>
    </form>
</p-dialog>
