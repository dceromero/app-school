<p-card class="auth-card">
  <ng-template #title>
    <div class="text-center">
      <h1>Iniciar Sesión</h1>
    </div>
  </ng-template>
  <ng-template #subtitle>
    <div class="border-line">
      <p-floatlabel variant="on">
        <input pInputText id="txtUser" autocomplete="off" fluid />
        <label for="txtUser">Usuario</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="mt-3">
        <p-password id="txtpsw" [feedback]="false" [toggleMask]="true" fluid />
        <label for="txtpsw">Password</label>
      </p-floatlabel>
    </div>
  </ng-template>
  <ng-template #footer>
    <div class="text-center">
      <p-button label="Ingresar" severity="info" class="text-center" />
    </div>
  </ng-template>
</p-card>
